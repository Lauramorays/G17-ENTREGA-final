<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recorrido jugable</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a07}
a{color:#c9d97a}a:hover{color:#e6f0a0}
.px{box-shadow:4px 0 0 0 #3b3d2c,-4px 0 0 0 #3b3d2c,0 4px 0 0 #3b3d2c,0 -4px 0 0 #3b3d2c,8px 0 0 0 #070705,-8px 0 0 0 #070705,0 8px 0 0 #070705,0 -8px 0 0 #070705,4px 4px 0 0 #070705,-4px 4px 0 0 #070705,4px -4px 0 0 #070705,-4px -4px 0 0 #070705}
.stage:focus{outline:none}
.pad{all:unset;box-sizing:border-box;cursor:pointer;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(14,15,10,.9);box-shadow:3px 0 0 0 #3b3d2c,-3px 0 0 0 #3b3d2c,0 3px 0 0 #3b3d2c,0 -3px 0 0 #3b3d2c;touch-action:none;user-select:none}
.pad:active,.pad:focus-visible{background:#2a2a1c;box-shadow:3px 0 0 0 #e6dfc0,-3px 0 0 0 #e6dfc0,0 3px 0 0 #e6dfc0,0 -3px 0 0 #e6dfc0}
.restart{all:unset;cursor:pointer;box-sizing:border-box;padding:10px 16px;min-height:44px;display:flex;align-items:center;gap:10px;background:#14150f;box-shadow:3px 0 0 0 #3b3d2c,-3px 0 0 0 #3b3d2c,0 3px 0 0 #3b3d2c,0 -3px 0 0 #3b3d2c;font-family:'Silkscreen',monospace;font-size:12px;color:#e6dfc0}
.restart:hover,.restart:focus-visible{box-shadow:3px 0 0 0 #e8b33a,-3px 0 0 0 #e8b33a,0 3px 0 0 #e8b33a,0 -3px 0 0 #e8b33a}
.pulse{position:absolute;border-radius:50%;border:3px solid #e8b33a;box-sizing:border-box;animation:pulse 1.6s infinite ease-out;pointer-events:none}
@keyframes pulse{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.float{animation:float 2.2s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.blink{animation:blink 1s infinite steps(1)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.note{position:absolute;animation:note 2.4s infinite ease-out;pointer-events:none}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(18px,-70px);opacity:0}}
.altl{animation:altl .5s infinite steps(1)}
@keyframes altl{0%{background:#e6dfc0}50%{background:#3b3d2c}}
.altr{animation:altr .5s infinite steps(1)}
@keyframes altr{0%{background:#3b3d2c}50%{background:#e6dfc0}}
.pop{animation:pop 1.2s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.2)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.vhs{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 6px);animation:vhs .2s infinite steps(2)}
@keyframes vhs{0%{background-position:0 0}100%{background-position:0 6px}}
.shake{animation:shake2 2s infinite steps(1)}
@keyframes shake2{0%,60%,100%{transform:translateX(0)}64%{transform:translateX(-3px)}68%{transform:translateX(3px)}72%{transform:translateX(-3px)}76%{transform:translateX(0)}}
.fadein{animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scan{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);pointer-events:none}
</style>
</helmet>
<div class="stage" tabIndex="0" ref="{{stageRef}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}" onClick="{{focusStage}}" aria-label="Recorrido jugable: flechas para caminar, espacio para actuar" style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: 'VT323', monospace; color: #e6dfc0; background: #0a0a07">

<!-- Mundo: se desatura cada vez que ignorás -->
<div style="position: absolute; inset: 0; filter: {{worldFilter}}; transform: translateX({{shakeX}})">
<img src="./assets/8c08db922fd45bf5ddc33fea8e03a06e.png" alt="Hall de la estación con boletería, molinetes, una columna ornamentada y la escalera de salida" style="position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; image-rendering: pixelated">
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.55) 100%)"></div>

<!-- Salida: cartel de la H a la derecha -->
<div class="float" role="img" aria-label="Salida hacia la línea H" style="position: absolute; left: 1222px; top: 540px; width: 40px; height: 40px; border-radius: 50%; background: #f2c200; box-shadow: 0 0 0 3px #070705; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 18px; color: #10110c">H</div>

<!-- Escena 5: fila de molinetes -->
<sc-if value="{{s5}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 690px; top: 250px; width: 56px; height: 128px; background: #6b6a55; box-shadow: inset 0 0 0 4px #3b3d2c, 0 0 0 3px #070705; background-image: repeating-linear-gradient(0deg, #6b6a55 0 30px, #4a4936 30px 34px)"></div>
<div style="position: absolute; left: 690px; top: 444px; width: 56px; height: 174px; background: #6b6a55; box-shadow: inset 0 0 0 4px #3b3d2c, 0 0 0 3px #070705; background-image: repeating-linear-gradient(0deg, #6b6a55 0 30px, #4a4936 30px 34px)"></div>
<div style="position: absolute; left: 750px; top: 364px; width: 22px; height: 26px; background: #2c2d21; box-shadow: 0 0 0 3px #070705; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 8px; background: {{readerColor}}"></div></div>
<div style="position: absolute; left: 690px; top: {{gateTop}}; width: 56px; height: 8px; background: {{gateColor}}; box-shadow: 0 0 0 2px #070705"></div>
<div style="position: absolute; left: 752px; top: 600px; width: 14px; height: 14px; background: {{gateColor}}; box-shadow: 0 0 0 3px #070705"></div>
</sc-if>

<!-- Escena 1: DNI pateado por el piso -->
<sc-if value="{{showDni}}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Documento en el piso" style="position: absolute; left: {{dniL}}; top: {{dniT}}" width="28" height="20" viewBox="0 0 14 10" shape-rendering="crispEdges"><rect x="0" y="0" width="14" height="10" fill="#d8d0b0"></rect><rect x="1" y="2" width="4" height="6" fill="#7d7a62"></rect><rect x="7" y="3" width="5" height="1" fill="#7d7a62"></rect><rect x="7" y="6" width="4" height="1" fill="#7d7a62"></rect></svg>
</sc-if>

<!-- Escena 3: notas que salen de la guitarra -->
<sc-if value="{{showNotes}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
<div class="note" style="left: {{n.l}}; top: {{n.t}}; animation-delay: {{n.d}}"><svg width="18" height="18" viewBox="0 0 6 6" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="4" fill="{{noteColor}}"></rect><rect x="4" y="0" width="2" height="1" fill="{{noteColor}}"></rect><rect x="1" y="3" width="3" height="2" fill="{{noteColor}}"></rect></svg></div>
</sc-for>
</sc-if>

<!-- Pulso de "alguien te necesita" -->
<sc-if value="{{showPulse}}" hint-placeholder-val="{{ false }}">
<div class="pulse" style="left: {{pulseL}}; top: {{pulseT}}; width: 120px; height: 120px"></div>
<div class="pulse" style="left: {{pulseL}}; top: {{pulseT}}; width: 120px; height: 120px; animation-delay: .8s"></div>
</sc-if>

<!-- Personas -->
<sc-for list="{{npcs}}" as="p" hint-placeholder-count="2">
<svg role="img" aria-label="{{p.label}}" style="position: absolute; left: {{p.l}}; top: {{p.t}}" width="{{p.w}}" height="{{p.h}}" viewBox="0 0 10 16" shape-rendering="crispEdges"><rect x="3" y="0" width="4" height="2" fill="{{p.hair}}"></rect><rect x="2" y="1" width="1" height="2" fill="{{p.hair}}"></rect><rect x="7" y="1" width="1" height="2" fill="{{p.hair}}"></rect><rect x="3" y="2" width="4" height="2" fill="#d9a77a"></rect><rect x="2" y="4" width="6" height="8" fill="{{p.coat}}"></rect><rect x="1" y="5" width="1" height="4" fill="{{p.coat}}"></rect><rect x="8" y="5" width="1" height="4" fill="{{p.coat}}"></rect><rect x="3" y="12" width="1" height="3" fill="#2c2d21"></rect><rect x="6" y="12" width="1" height="3" fill="#2c2d21"></rect><rect x="2" y="15" width="2" height="1" fill="#10110c"></rect><rect x="6" y="15" width="2" height="1" fill="#10110c"></rect></svg>
</sc-for>

<!-- Escena 3: guitarra · Escena 4: caja de medias -->
<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" style="position: absolute; left: 596px; top: 290px" width="36" height="36" viewBox="0 0 9 9" shape-rendering="crispEdges"><rect x="1" y="4" width="4" height="4" fill="#a8322a"></rect><rect x="2" y="5" width="2" height="2" fill="#10110c"></rect><rect x="5" y="2" width="1" height="3" fill="#7a5a3a"></rect><rect x="6" y="1" width="2" height="2" fill="#7a5a3a"></rect></svg>
<svg aria-hidden="true" style="position: absolute; left: 640px; top: 314px" width="36" height="20" viewBox="0 0 9 5" shape-rendering="crispEdges"><rect x="0" y="1" width="9" height="4" fill="#3b3d2c"></rect><rect x="1" y="2" width="7" height="2" fill="#5a2420"></rect><sc-if value="{{coinInCase}}" hint-placeholder-val="{{ false }}"><rect x="4" y="2" width="2" height="1" fill="#e8b33a"></rect></sc-if></svg>
</sc-if>
<sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" style="position: absolute; left: 748px; top: 628px" width="40" height="28" viewBox="0 0 10 7" shape-rendering="crispEdges"><rect x="0" y="2" width="10" height="5" fill="#c8b98a"></rect><rect x="1" y="0" width="2" height="3" fill="#a8322a"></rect><rect x="4" y="0" width="2" height="3" fill="#3b5fa0"></rect><rect x="7" y="0" width="2" height="3" fill="#e6dfc0"></rect></svg>
</sc-if>

<!-- Personaje -->
<div style="position: absolute; left: {{pl}}; top: {{pt}}; width: 40px; height: 64px">
<svg role="img" aria-label="Tu personaje" width="40" height="64" viewBox="0 0 10 16" shape-rendering="crispEdges" style="transform: scaleX({{face}})"><rect x="3" y="0" width="4" height="3" fill="#2a1d14"></rect><rect x="2" y="1" width="1" height="2" fill="#2a1d14"></rect><rect x="7" y="1" width="1" height="2" fill="#2a1d14"></rect><rect x="2" y="3" width="6" height="7" fill="#3b5fa0"></rect><rect x="3" y="4" width="4" height="5" fill="#7a5a3a"></rect><rect x="1" y="4" width="1" height="4" fill="#3b5fa0"></rect><rect x="8" y="4" width="1" height="4" fill="#3b5fa0"></rect><rect x="3" y="10" width="4" height="2" fill="#2c2d21"></rect></svg>
<sc-if value="{{stepA}}" hint-placeholder-val="{{ true }}"><svg style="position: absolute; left: 0; top: 0" width="40" height="64" viewBox="0 0 10 16" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="12" width="1" height="3" fill="#2c2d21"></rect><rect x="6" y="12" width="1" height="2" fill="#2c2d21"></rect><rect x="2" y="15" width="2" height="1" fill="#10110c"></rect><rect x="6" y="14" width="2" height="1" fill="#10110c"></rect></svg></sc-if>
<sc-if value="{{stepB}}" hint-placeholder-val="{{ false }}"><svg style="position: absolute; left: 0; top: 0" width="40" height="64" viewBox="0 0 10 16" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="12" width="1" height="2" fill="#2c2d21"></rect><rect x="6" y="12" width="1" height="3" fill="#2c2d21"></rect><rect x="2" y="14" width="2" height="1" fill="#10110c"></rect><rect x="6" y="15" width="2" height="1" fill="#10110c"></rect></svg></sc-if>
<sc-if value="{{carryDni}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" style="position: absolute; left: 24px; top: 26px" width="18" height="13" viewBox="0 0 14 10" shape-rendering="crispEdges"><rect x="0" y="0" width="14" height="10" fill="#d8d0b0"></rect><rect x="1" y="2" width="4" height="6" fill="#7d7a62"></rect></svg></sc-if>
</div>
</div>

<!-- Ritmo: anillo que se cierra sobre el personaje -->
<sc-if value="{{rhythmOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{rtL}}; top: {{rtT}}; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #e6dfc0; box-sizing: border-box; pointer-events: none"></div>
<div style="position: absolute; left: {{rrL}}; top: {{rrT}}; width: {{rrS}}; height: {{rrS}}; border-radius: 50%; border: 4px solid #c9d97a; box-sizing: border-box; pointer-events: none"></div>
<div style="position: absolute; left: {{rdL}}; top: {{rdT}}; display: flex; gap: 6px; pointer-events: none">
<sc-for list="{{rhythmDots}}" as="d" hint-placeholder-count="4"><div style="width: 10px; height: 10px; background: {{d.bg}}; box-shadow: 0 0 0 2px #070705"></div></sc-for>
</div>
</sc-if>

<!-- Mantener: barra de carga bajo el personaje -->
<sc-if value="{{holdOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{hbL}}; top: {{hbT}}; display: flex; gap: 3px; padding: 3px; background: #070705; pointer-events: none">
<sc-for list="{{holdSegs}}" as="h" hint-placeholder-count="8"><div style="width: 7px; height: 10px; background: {{h.bg}}"></div></sc-for>
</div>
</sc-if>

<!-- Alternar: ← → titilando junto al personaje -->
<sc-if value="{{altOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{alL}}; top: {{alT}}; display: flex; gap: 4px; pointer-events: none">
<div class="altl" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #070705"><svg width="12" height="12" viewBox="0 0 7 7" aria-hidden="true" shape-rendering="crispEdges" style="transform: rotate(-90deg)"><rect x="3" y="1" width="1" height="1" fill="#10110c"></rect><rect x="2" y="2" width="3" height="1" fill="#10110c"></rect><rect x="1" y="3" width="5" height="1" fill="#10110c"></rect><rect x="3" y="4" width="1" height="2" fill="#10110c"></rect></svg></div>
<div class="altr" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #070705"><svg width="12" height="12" viewBox="0 0 7 7" aria-hidden="true" shape-rendering="crispEdges" style="transform: rotate(90deg)"><rect x="3" y="1" width="1" height="1" fill="#10110c"></rect><rect x="2" y="2" width="3" height="1" fill="#10110c"></rect><rect x="1" y="3" width="5" height="1" fill="#10110c"></rect><rect x="3" y="4" width="1" height="2" fill="#10110c"></rect></svg></div>
</div>
</sc-if>

<!-- Ícono de acción sobre la persona u objeto -->
<sc-if value="{{showBubble}}" hint-placeholder-val="{{ false }}">
<div class="float" style="position: absolute; left: {{bL}}; top: {{bT}}; display: flex; flex-direction: column; align-items: center; pointer-events: none">
<div style="width: 56px; height: 56px; background: #14150f; box-shadow: 0 0 0 4px #e8b33a, 0 0 0 7px #070705; display: flex; align-items: center; justify-content: center">
<sc-if value="{{iGrab}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="1" width="7" height="4" fill="#e6dfc0"></rect><rect x="2" y="3" width="1" height="2" fill="#e6dfc0"></rect><rect x="3" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="5" y="5" width="1" height="3" fill="#e6dfc0"></rect><rect x="7" y="5" width="1" height="3" fill="#e6dfc0"></rect><rect x="9" y="5" width="1" height="2" fill="#e6dfc0"></rect><rect x="3" y="9" width="7" height="2" fill="#d8d0b0"></rect></svg></sc-if>
<sc-if value="{{iDni}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#d8d0b0"></rect><rect x="2" y="4" width="3" height="4" fill="#7d7a62"></rect><rect x="6" y="5" width="4" height="1" fill="#7d7a62"></rect><rect x="6" y="7" width="3" height="1" fill="#7d7a62"></rect></svg></sc-if>
<sc-if value="{{iExplain}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="1" width="10" height="7" fill="#e6dfc0"></rect><rect x="2" y="8" width="2" height="2" fill="#e6dfc0"></rect><rect x="2" y="3" width="3" height="3" fill="#3bb3e6"></rect><rect x="5" y="4" width="2" height="1" fill="#10110c"></rect><rect x="7" y="3" width="3" height="3" fill="#f2c200"></rect></svg></sc-if>
<sc-if value="{{iNote}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="4" y="1" width="6" height="2" fill="#c9d97a"></rect><rect x="4" y="3" width="1" height="5" fill="#c9d97a"></rect><rect x="9" y="3" width="1" height="4" fill="#c9d97a"></rect><rect x="2" y="7" width="3" height="3" fill="#c9d97a"></rect><rect x="7" y="6" width="3" height="3" fill="#c9d97a"></rect></svg></sc-if>
<sc-if value="{{iMoney}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="5" y="0" width="2" height="2" fill="#7fd18a"></rect><rect x="4" y="2" width="5" height="1" fill="#7fd18a"></rect><rect x="3" y="3" width="2" height="2" fill="#7fd18a"></rect><rect x="4" y="5" width="4" height="1" fill="#7fd18a"></rect><rect x="7" y="6" width="2" height="2" fill="#7fd18a"></rect><rect x="3" y="8" width="5" height="1" fill="#7fd18a"></rect><rect x="5" y="9" width="2" height="2" fill="#7fd18a"></rect></svg></sc-if>
<sc-if value="{{iCard}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="3" width="10" height="7" fill="#2f7d6d"></rect><rect x="1" y="3" width="10" height="1" fill="#24645a"></rect><rect x="1" y="7" width="10" height="1" fill="#e8b33a"></rect><rect x="2" y="4" width="2" height="2" fill="#d8c27a"></rect></svg></sc-if>
</div>
<div style="width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #e8b33a; margin-top: 3px"></div>
<div style="margin-top: 6px; display: flex; align-items: center; gap: 4px">
<div class="{{keyClass}}" style="width: 40px; height: 16px; background: #e6dfc0; box-shadow: 0 0 0 3px #070705; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; box-sizing: border-box"><div style="width: 24px; height: 3px; background: #10110c"></div></div>
<sc-if value="{{hintHold}}" hint-placeholder-val="{{ false }}"><div style="width: 22px; height: 8px; background: #3b3d2c; box-shadow: 0 0 0 2px #070705; position: relative"><div class="blink" style="position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #e8b33a"></div></div></sc-if>
</div>
</div>
</sc-if>

<!-- Moneda que se arrastra hasta la mano del vendedor -->
<sc-if value="{{coinOn}}" hint-placeholder-val="{{ false }}">
<div class="blink" style="position: absolute; left: 726px; top: 591px; width: 40px; height: 40px; box-shadow: inset 0 0 0 3px #e8b33a; pointer-events: none"></div>
<svg aria-hidden="true" style="position: absolute; left: {{coinL}}; top: {{coinT}}" width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="4" y="1" width="4" height="1" fill="#e8b33a"></rect><rect x="2" y="2" width="8" height="1" fill="#e8b33a"></rect><rect x="1" y="3" width="10" height="6" fill="#e8b33a"></rect><rect x="2" y="9" width="8" height="1" fill="#e8b33a"></rect><rect x="4" y="10" width="4" height="1" fill="#e8b33a"></rect><rect x="5" y="4" width="2" height="4" fill="#b88a20"></rect></svg>
</sc-if>

<!-- Trazar: mini plano de la combinación -->
<sc-if value="{{traceOn}}" hint-placeholder-val="{{ false }}">
<div class="px" style="position: absolute; left: 470px; top: 96px; width: 340px; height: 200px; background: rgba(14,15,10,.96); pointer-events: none">
<sc-for list="{{traceSegs}}" as="sg" hint-placeholder-count="4">
<div class="{{sg.cls}}" style="position: absolute; left: {{sg.l}}; top: {{sg.t}}; width: {{sg.w}}; height: {{sg.h}}; background: {{sg.bg}}"></div>
</sc-for>
<div style="position: absolute; left: 26px; top: 36px; width: 28px; height: 28px; border-radius: 50%; background: #3bb3e6; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; color: #10110c">A</div>
<div style="position: absolute; left: 186px; top: 36px; width: 28px; height: 28px; background: #14150f; box-shadow: inset 0 0 0 5px #e6dfc0"></div>
<div style="position: absolute; left: 266px; top: 116px; width: 28px; height: 28px; border-radius: 50%; background: #f2c200; display: flex; align-items: center; justify-content: center; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; color: #10110c">H</div>

  }
  renderVals() {
    const g = this.g, s = g.scene;
    const P = (v) => Math.round(v) + 'px';
    const tgt = this.target();
    const left = g.left;
    const abs = Math.abs(Math.round(left));
    const clock = (left < 0 ? '+' : '') + String(Math.floor(abs / 60)).padStart(2, '0') + ':' + String(abs % 60).padStart(2, '0');
    const person = (x, y, hair, coat, sc, label) => ({ l: P(x - 20 * sc), t: P(y - 62 * sc), w: Math.round(40 * sc), h: Math.round(64 * sc), hair, coat, label });
    const npcs = [];
    if (s === 1 && g.ownerOn) npcs.push(person(1120, 640, '#2a1d14', '#a8322a', 1, 'Dueño del documento'));
    if (s === 2) npcs.push(person(985, g.npcY, '#6b6a55', '#2f5d7a', 1, 'Persona que pregunta por la línea'));
    if (s === 3) npcs.push(person(590, 330, '#c9a24a', '#3a6b3a', 1, 'Artista callejero'));
    if (s === 4) { npcs.push(person(720, 655, '#2a1d14', '#7a5a3a', 1, 'Vendedor ambulante')); npcs.push(person(g.kx, g.ky, '#2a1d14', '#e8b33a', 0.72, 'Niño')); }
    if (s === 5 && g.senX < 1290) npcs.push(person(g.senX, 412, '#bdb795', '#6b4a7a', 1, 'Señora con la tarjeta rechazada'));
    const m = g.mini;
    const showBubble = !!tgt && g.inRange && !m && g.phase === 'play';
    const bubbleTop = tgt ? tgt.y - (tgt.obj ? 120 : 160) : 0;
    const holdScene = (s === 1 && !g.picked) || s === 5;
    let rr = 0, rhythmDots = [], rhythmOn = false;
    if (m && m.type === 'rh') {
      rhythmOn = true;
      let next = 0; while (next < 4 && m.judged[next]) next++;
      const T = 0.9 + Math.min(next, 3) * 0.6;
      rr = next < 4 ? 56 + Math.max(0, T - m.t) * 180 : 56;
      rhythmDots = m.judged.map((j) => ({ bg: j === 'hit' ? '#c9d97a' : j === 'miss' ? '#e05a4a' : '#3b3d2c' }));
    }
    const segs = [];
    if (m && m.type === 'trace') {
      const node = (i, j) => [40 + i * 80, 50 + j * 80];
      const path = [[0, 0], [1, 0], [2, 0], [2, 1], [3, 1]];
      for (let i = 0; i < 4; i++) {
        const a = node(...path[i]), b = node(...path[i + 1]);
        const done = i < m.step, next = i === m.step;
        const color = done ? (i < 2 ? '#3bb3e6' : '#f2c200') : next ? '#e6dfc0' : '#2c2d21';
        segs.push({ l: P(Math.min(a[0], b[0]) - 5), t: P(Math.min(a[1], b[1]) - 5), w: P(Math.abs(a[0] - b[0]) + 10), h: P(Math.abs(a[1] - b[1]) + 10), bg: color, cls: next ? 'blink' : '' });
      }
      var tp = node(...path[m.step]);
    }
    const progress = [0, 1, 2, 3, 4].map((i) => {
      const r = g.res[i];
      return { bg: r === 'help' ? '#e8b33a' : r === 'ignore' ? '#4a4936' : '#1a1b14', ring: i === s - 1 && g.phase !== 'end' ? '0 0 0 2px #e6dfc0' : '0 0 0 2px #070705' };
    });
    const step = Math.floor(g.dist / 14) % 2 === 0;
    const fadeOp = g.phase === 'fade' ? (g.fade < 0.35 ? g.fade / 0.35 : Math.max(0, (0.7 - g.fade) / 0.35)) : 0;
    const ended = g.phase === 'end';
    const shake = g.shakeT > 0 ? (Math.round(g.t * 60) % 2 ? '3px' : '-3px') : '0px';
    const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    return {
      scanlines: this.props.scanlines ?? true,
      worldFilter: 'grayscale(' + Math.min(1, g.ignores * 0.2).toFixed(2) + ') saturate(' + (1 + g.helps * 0.12).toFixed(2) + ')',
      shakeX: shake,
      s3: s === 3, s4: s === 4, s5: s === 5,
      readerColor: g.resolved === 'help' ? '#7fd18a' : '#e05a4a',
      gateColor: this.gateOpen() ? '#7fd18a' : '#e05a4a',
      gateTop: this.gateOpen() ? '612px' : '652px',
      showDni: s === 1 && !g.picked && !g.resolved,
      dniL: P(g.dni ? g.dni.x - 14 : 0), dniT: P(g.dni ? g.dni.y - 10 : 0),
      carryDni: s === 1 && g.picked && !g.resolved,
      showNotes: s === 3 && g.resolved !== 'ignore',
      noteColor: g.resolved === 'help' ? '#e8b33a' : '#c9d97a',
      notes: [{ l: '590px', t: '270px', d: '0s' }, { l: '610px', t: '262px', d: '.8s' }, { l: '575px', t: '280px', d: '1.6s' }],
      coinInCase: !!g.coinInCase,
      showPulse: !!tgt && g.phase === 'play' && !m,
      pulseL: P(tgt ? tgt.x - 60 : 0), pulseT: P(tgt ? tgt.y - 60 : 0),
      npcs,
      pl: P(g.x - 20), pt: P(g.y - 62), face: g.face < 0 ? -1 : 1,
      stepA: !g.moving || step, stepB: g.moving && !step,
      rhythmOn, rtL: P(g.x - 28), rtT: P(g.y - 58), rrS: P(rr), rrL: P(g.x - rr / 2), rrT: P(g.y - 30 - rr / 2), rdL: P(g.x - 26), rdT: P(g.y + 14), rhythmDots,
      holdOn: holdScene && g.prog > 0,
      hbL: P(g.x - 42), hbT: P(g.y + 10),
      holdSegs: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({ bg: i < g.prog * 8 ? '#e8b33a' : '#2c2d21' })),
      altOn: g.phase === 'play' && !g.resolved && !m && ((s === 2 && g.contact) || (s === 4 && g.kid)),
      alL: P(g.x - 28), alT: P(g.y - 100),
      showBubble, bL: P(tgt ? tgt.x - 28 : 0), bT: P(bubbleTop),
      iGrab: s === 1 && !g.picked, iDni: s === 1 && g.picked, iExplain: s === 2, iNote: s === 3, iMoney: s === 4, iCard: s === 5,
      hintHold: holdScene, keyClass: holdScene ? '' : 'blink',
      coinOn: !!(m && m.type === 'coin'), coinL: P(m && m.cx ? m.cx - 12 : 0), coinT: P(m && m.cy ? m.cy - 12 : 0),
      traceOn: !!(m && m.type === 'trace'), traceSegs: segs, tpL: P(tp ? tp[0] - 6 : 0), tpT: P(tp ? tp[1] - 6 : 0),
      popOn: g.popT > 0 && !!g.popAt, popL: P(g.popAt ? g.popAt.x - 22 : 0), popT: P(g.popAt ? g.popAt.y - 130 : 0),
      ffOn: g.ff > 0,
      timerColor: left > 240 ? '#e6dfc0' : left > 0 ? '#e8b33a' : '#e05a4a',
      clock, progress,
      showHint: !g.moved && s === 1 && g.phase === 'play',
      keysHint: [{ r: '-90deg' }, { r: '0deg' }, { r: '180deg' }, { r: '90deg' }],
      fadeOp: fadeOp.toFixed(2),
      endLate: ended && g.helps >= 3, endCancel: ended && g.helps < 3, ended,
      stageRef: this.stageRef,
      focusStage: () => this.focus(),
      keyDown: (e) => {
        if (ARROWS.includes(e.key)) {
          e.preventDefault();
          if (!e.repeat) {
            if (this.arrowInMini(e.key)) return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') this.alternate(e.key);
          }
          this.g.keys = { ...this.g.keys, [e.key]: true };
        } else if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          if (!e.repeat) this.press();
          this.g.hold = true;
        } else if ((e.key === 'r' || e.key === 'R') && this.g.phase === 'end') { this.reset(); }
      },
      keyUp: (e) => {
        if (ARROWS.includes(e.key)) { e.preventDefault(); const k = { ...this.g.keys }; delete k[e.key]; this.g.keys = k; }
        else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); this.g.hold = false; }
      },
      padAct: (e) => { e.preventDefault(); this.press(); this.g.hold = true; },
      padActUp: () => { this.g.hold = false; },
      padUp: (e) => { e.preventDefault(); if (!this.arrowInMini('ArrowUp')) this.g.keys = { ArrowUp: true }; },
      padDown: (e) => { e.preventDefault(); if (!this.arrowInMini('ArrowDown')) this.g.keys = { ArrowDown: true }; },
      padLeft: (e) => { e.preventDefault(); if (!this.arrowInMini('ArrowLeft')) { this.alternate('ArrowLeft'); this.g.keys = { ArrowLeft: true }; } },
      padRight: (e) => { e.preventDefault(); if (!this.arrowInMini('ArrowRight')) { this.alternate('ArrowRight'); this.g.keys = { ArrowRight: true }; } },
      padRelease: () => { this.g.keys = {}; },
      restart: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.reset(); this.focus(); }
    };
  }
}
</script>
